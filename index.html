<!DOCTYPE html>
<html lang="pt-PT">
  <head>
    <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0" />
    <meta charset="UTF-8" />
    <title>Teste AR.js - Bolsos - Marcadores Dinâmicos</title>
    
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v6.1.1/dist/aframe-extras.min.js"></script>

    <style>
      body {
        margin: 0px;
        overflow: hidden;
        font-family: sans-serif;
      }

      #arjs-video {
        width: 100vw !important;
        height: 100vh !important;
        position: fixed !important;
        top: 0 !important;
        left: 0 !important;
        margin: 0px !important;
        padding: 0px !important;
        object-fit: cover !important; 
      }

      #ar-instructions {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(0, 0, 0, 0.75);
        color: white;
        padding: 12px 24px;
        border-radius: 30px;
        font-size: 14px;
        z-index: 999;
        text-align: center;
        pointer-events: none;
        box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      }
    </style>
  </head>
  <body>

    <div id="ar-instructions">
      A carregar ambiente de Realidade Aumentada...
    </div>

    <!-- CORREÇÃO 3: Adicionadas as configurações de cor e luz exatamente como no MindAR -->
    <a-scene 
      id="ar-scene"
      embedded 
      color-space="sRGB"
      renderer="colorManagement: true, physicallyCorrectLights: true"
      arjs="sourceType: webcam; 
            debugUIEnabled: false; 
            detectionMode: mono_and_matrix; 
            matrixCodeType: 3x3_PARITY65;
            sourceWidth: 1280; 
            sourceHeight: 720; 
            displayWidth: 1280; 
            displayHeight: 720;">
      
      <!-- CORREÇÃO 4: Câmara bloqueada da mesma forma que no MindAR -->
      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
    </a-scene>

    <script>
      window.addEventListener('DOMContentLoaded', () => {
        const urlParams = new URLSearchParams(window.location.search);
        const modelParam = urlParams.get('model') || '02_Bolsos'; 
        const markerParam = urlParams.get('marker'); 

        const sceneEl = document.getElementById('ar-scene');
        const instructionsEl = document.getElementById('ar-instructions');

        const markerEl = document.createElement('a-marker');

        if (markerParam !== null && !isNaN(markerParam)) {
          markerEl.setAttribute('type', 'barcode');
          markerEl.setAttribute('value', markerParam);
          instructionsEl.textContent = `Aponta a câmara para o Marcador de Código de Barras #${markerParam}`;
        } else {
          markerEl.setAttribute('type', 'pattern');
          markerEl.setAttribute('url', './assets/pattern-marker.patt');
          instructionsEl.textContent = "Aponta a câmara para o teu Marcador Personalizado";
        }

        // Utilizamos <a-gltf-model> em vez de <a-entity> para replicar o MindAR
        const modelEntity = document.createElement('a-gltf-model');
        modelEntity.setAttribute('src', `./assets/${modelParam}.glb`);
        
        // CORREÇÃO 1 e 2: Script de autocentragem removido e escala aplicada para 15
        modelEntity.setAttribute('scale', '15 15 15'); 
        modelEntity.setAttribute('position', '0 0 0');
        modelEntity.setAttribute('rotation', '0 0 0');
        
        modelEntity.setAttribute('animation-mixer', '');

        markerEl.appendChild(modelEntity);
        sceneEl.appendChild(markerEl);
      });
    </script>
  </body>
</html>
